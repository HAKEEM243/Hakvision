name: Diagnostic engagement (temporaire, lecture seule)

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Etat actuel en production pour tooro vs eclipse (reference qui marche)
        run: |
          echo "--- En-tetes bruts de la page article (sans suivre la redirection) ---"
          curl -sS -D - -o /dev/null "https://elucco.pages.dev/article-condoleances-tooro-sept2026.html"
          echo
          echo "--- Meme test sur l'article eclipse (reference) ---"
          curl -sS -D - -o /dev/null "https://elucco.pages.dev/article-eclipse-aout2026.html"
          echo
          echo "--- HTTP code en suivant la redirection ---"
          curl -sSL -o /dev/null -w "HTTP final %{http_code}, url finale: %{url_effective}\n" "https://elucco.pages.dev/article-condoleances-tooro-sept2026.html"
          echo
          echo "--- /api/stats pour tooro et eclipse ---"
          curl -sS "https://elucco.pages.dev/api/stats?ids=feat_condoleances_tooro,feat_eclipse"
          echo
          echo "--- /api/comments pour tooro ---"
          curl -sS "https://elucco.pages.dev/api/comments?id=feat_condoleances_tooro&limit=10"
          echo
          echo "--- /api/comments pour eclipse (reference) ---"
          curl -sS "https://elucco.pages.dev/api/comments?id=feat_eclipse&limit=3"
          echo
