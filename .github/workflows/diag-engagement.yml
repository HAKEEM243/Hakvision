name: Diagnostic engagement (temporaire, lecture seule)

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Etat actuel en production pour tooro vs eclipse (reference qui marche)
        run: |
          echo "--- En-tetes bruts de la page article (sans suivre la redirection) ---"
          curl -sS -D - -o /dev/null "https://elucco.pages.dev/article-condoleances-tooro-sept2026.html"
          echo
          echo "--- Meme test sur l'article eclipse (reference) ---"
          curl -sS -D - -o /dev/null "https://elucco.pages.dev/article-eclipse-aout2026.html"
          echo
          echo "--- HTTP code en suivant la redirection ---"
          curl -sSL -o /dev/null -w "HTTP final %{http_code}, url finale: %{url_effective}\n" "https://elucco.pages.dev/article-condoleances-tooro-sept2026.html"
          echo
          echo "--- /api/stats pour tooro et eclipse ---"
          curl -sS "https://elucco.pages.dev/api/stats?ids=feat_condoleances_tooro,feat_eclipse"
          echo
          echo "--- /api/comments pour tooro ---"
          curl -sS "https://elucco.pages.dev/api/comments?id=feat_condoleances_tooro&limit=10"
          echo
          echo "--- /api/comments pour eclipse (reference) ---"
          curl -sS "https://elucco.pages.dev/api/comments?id=feat_eclipse&limit=3"
          echo
          echo "--- Contenu HTML servi en production : script d'engagement (article tooro) ---"
          curl -sSL "https://elucco.pages.dev/article-condoleances-tooro-sept2026.html" | grep -n "ARTICLE_ID\|eng-submit\|eng-text\|eng-name\|eng-comment-list\|eng-like-btn" || echo "(aucune correspondance trouvee)"
          echo
          echo "--- Test POST direct sur /api/comments pour tooro (diagnostic serveur) ---"
          curl -sS -D - -o /tmp/post_body.json -X POST -H "Content-Type: application/json" \
            -d "{\"id\":\"feat_condoleances_tooro\",\"author\":\"Diag CI\",\"text\":\"Test diagnostic automatise $(date -u +%s)\"}" \
            "https://elucco.pages.dev/api/comments"
          echo
          cat /tmp/post_body.json
          echo
          echo "--- Relecture immediate de /api/comments pour tooro apres le POST direct ---"
          curl -sS "https://elucco.pages.dev/api/comments?id=feat_condoleances_tooro&limit=5"
          echo
          echo "--- Nettoyage : suppression du/des commentaire(s) de diagnostic ---"
          curl -sS -X POST "https://elucco.pages.dev/api/_diag-cleanup"
          echo
          echo "--- Relecture apres nettoyage (doit revenir a l'etat initial) ---"
          curl -sS "https://elucco.pages.dev/api/comments?id=feat_condoleances_tooro&limit=5"
          echo
