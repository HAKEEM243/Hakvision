        likes: found.likes || 0,
        img: found.img || found.image || '',
        youtubeId: found.ytId || found.youtubeId || '',
        paragraphs: found.desc ? [found.desc] : ['Article de la communauté ELUCCO.'],
        highlight: '',
        closing: '',
      };
    }
  }
  if(!art){
    document.title='ELUCCO — Article introuvable';
    document.getElementById('art-hero-title').textContent = 'Article introuvable';
    document.getElementById('art-body-text').innerHTML = '<p style="color:rgba(255,255,255,0.5);text-align:center;padding:40px 0">Cet article n\'existe pas ou a été supprimé.</p>';
    return;
  }
  currentArticle = art;
  renderArticle(art);
});

function renderArticle(art){
  // Update page title
  document.title = art.title + ' — ELUCCO';
  document.getElementById('html-title').textContent = art.title + ' — ELUCCO';
  document.getElementById('header-title').textContent = 'ELUCCO';

  // Update OG meta tags dynamically
  const pageUrl = BASE_URL + '/article?id=' + art.id;
  const imgUrl  = art.img ? (art.img.startsWith('data:') ? art.img : BASE_URL + '/' + art.img) : BASE_URL + '/sa_majeste_trone_1.jpg';
  document.getElementById('og-title').setAttribute('content', art.title);
  document.getElementById('og-description').setAttribute('content', art.paragraphs[0].substring(0,160));
  document.getElementById('og-image').setAttribute('content', imgUrl);
  document.getElementById('og-url').setAttribute('content', pageUrl);
  document.getElementById('tw-title').setAttribute('content', art.title);
  document.getElementById('tw-description').setAttribute('content', art.paragraphs[0].substring(0,160));
  document.getElementById('tw-image').setAttribute('content', imgUrl);

  // ─── SEO: Update canonical link ───
  const canonicalEl = document.getElementById('canonical-link');
  if(canonicalEl) canonicalEl.setAttribute('href', pageUrl);
  
  // ─── SEO: Update description & keywords meta ───
  const metaDesc = document.getElementById('meta-description');
  if(metaDesc) metaDesc.setAttribute('content', art.paragraphs[0].substring(0,160));
  const metaKw = document.getElementById('meta-keywords');
  if(metaKw) metaKw.setAttribute('content', 'ELUCCO, Masambukidi, ' + art.title + ', Église Lumière du Christ au Congo, Kinshasa, RDC');

  // ─── SEO: Update JSON-LD schema dynamically ───
  const schemaEl = document.getElementById('article-schema');
  if(schemaEl){
    const schemaType = art.youtubeId ? 'VideoObject' : 'NewsArticle';
    const schemaData = {
      "@context": "https://schema.org",
      "@type": schemaType,
      "headline": art.title,
      "name": art.title,
      "image": imgUrl,
      "datePublished": art.date || "2026-03-08",
      "dateModified": "2026-03-18",
      "author": {"@type":"Organization","name":"ELUCCO — Église Lumière du Christ au Congo"},
      "publisher": {
        "@type":"Organization",
        "name":"ELUCCO — Église Lumière du Christ au Congo",
        "logo":{"@type":"ImageObject","url":"https://elucco.pages.dev/masambukidi_armoiries.png"}
      },
      "description": art.paragraphs[0].substring(0,160),
      "url": pageUrl
    };
    if(art.youtubeId){
      schemaData.embedUrl = 'https://www.youtube.com/embed/' + art.youtubeId;
      schemaData.thumbnailUrl = 'https://i.ytimg.com/vi/' + art.youtubeId + '/hqdefault.jpg';
      schemaData.uploadDate = art.date || "2026-03-08";
    }
    schemaEl.textContent = JSON.stringify(schemaData, null, 2);
  }
  // ─── SEO: Update BreadcrumbList ───
  const bcEl = document.getElementById('breadcrumb-schema');
  if(bcEl){
    const bc = {
      "@context":"https://schema.org",
      "@type":"BreadcrumbList",
      "itemListElement":[
        {"@type":"ListItem","position":1,"name":"Accueil","item":"https://elucco.pages.dev/"},
        {"@type":"ListItem","position":2,"name":"Actualités","item":"https://elucco.pages.dev/#actualites"},
        {"@type":"ListItem","position":3,"name":art.title,"item":pageUrl}
      ]
    };
    bcEl.textContent = JSON.stringify(bc, null, 2);
  }

  // Hero
  document.getElementById('art-hero-title').textContent = art.title;
  const badge = document.getElementById('art-badge');
  if(art.badge === 'royal'){
    badge.innerHTML = '<i class="fas fa-crown"></i> Royal';
    badge.style.background = 'linear-gradient(135deg,#c9a84c,#a0802a)';
  } else if(art.badge === 'video'){
    badge.innerHTML = '<i class="fas fa-play-circle"></i> Vidéo';
    badge.style.background = 'linear-gradient(135deg,#e53935,#b71c1c)';
  }

  if(art.youtubeId){
    // Video article
    document.getElementById('art-hero-wrap').style.display='none';
    const vw = document.getElementById('art-video-wrap');
    vw.style.display='block';
    document.getElementById('art-video-iframe').src = 'https://www.youtube.com/embed/' + art.youtubeId + '?rel=0&modestbranding=1';
  } else if(art.img){
    document.getElementById('art-main-img').src = art.img.startsWith('data:') ? art.img : art.img;
    document.getElementById('art-main-img').alt = art.title;
  }

  // Meta
  document.getElementById('art-date').textContent = art.date || '';
  if(art.location){
    const locEl = document.getElementById('art-location');
    locEl.textContent = art.location;
    locEl.style.display = 'inline';
  }
  if(art.photoDate){
    document.getElementById('art-photo-date').textContent = art.photoDate;
    document.getElementById('art-photo-date-wrap').style.display = 'flex';
  }
  if(art.views && art.youtubeId){
    document.getElementById('art-views-wrap').style.display = 'flex';
    document.getElementById('art-views').textContent = art.views;
  }

  // Body text
  let html = '';
  art.paragraphs.forEach((p, i) => {
    html += '<p>' + p + '</p>';
    if(i === 1 && art.highlight){
      html += '<span class="art-highlight"><i class="fas fa-quote-left" style="margin-right:8px;opacity:0.5"></i>' + art.highlight + '</span>';
    }
  });
  if(art.closing){
    html += '<p style="text-align:center;margin-top:24px;font-family:var(--font-title);font-size:1rem;color:var(--gold);letter-spacing:1px">' + art.closing + '</p>';
  }
  document.getElementById('art-body-text').innerHTML = html;

  // Likes
  const likes = getLS('likes_' + art.id, art.likes || 0);
  const liked  = getLS('liked_' + art.id, false);
}



/* ═══════════════════════════════════
   SHARE
═══════════════════════════════════ */
function getArticleUrl(){
  if(!currentArticle) return window.location.href;
  return BASE_URL + '/article?id=' + currentArticle.id;
}
function shareArticle(){
  const url   = getArticleUrl();
  const title = currentArticle ? currentArticle.title : 'ELUCCO';
  const text  = title + ' — ELUCCO Eglise Lumière du Christ au Congo';
  if(navigator.share){
    navigator.share({ title, text, url }).catch(()=>{});
    return;
  }
  // Fallback: copy link
  copyLink();
}
function shareFacebook(){
  const url = encodeURIComponent(getArticleUrl());
  window.open('https://www.facebook.com/sharer/sharer.php?u='+url,'_blank');
}
function shareWhatsapp(){
  const url   = encodeURIComponent(getArticleUrl());
  const title = encodeURIComponent((currentArticle?currentArticle.title:'ELUCCO') + ' — ELUCCO');
  window.open('https://wa.me/?text='+title+'%20'+url,'_blank');
}
function copyLink(){
  const url = getArticleUrl();
  if(navigator.clipboard){
    navigator.clipboard.writeText(url).then(()=>showToast('Lien copié ! 📋','success')).catch(()=>fallbackCopy(url));
  } else { fallbackCopy(url); }
}
function fallbackCopy(url){
  const ta = document.createElement('textarea');
  ta.value = url; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); showToast('Lien copié ! 📋','success'); }
  catch{ showToast('Impossible de copier'); }
  document.body.removeChild(ta);
}

/* ═══════════════════════════════════
   LIGHTBOX
═══════════════════════════════════ */
function openLightbox(){
  const img = document.getElementById('art-main-img');
  if(!img || !img.src) return;
  document.getElementById('art-lightbox-img').src = img.src;
  document.getElementById('art-lightbox').classList.add('show');
  document.body.style.overflow='hidden';
}
function closeLightbox(){
  document.getElementById('art-lightbox').classList.remove('show');
  document.body.style.overflow='';
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeLightbox(); });

/* ═══════════════════════════════════
   TOAST
═══════════════════════════════════ */
function showToast(msg, type='info'){
  const t = document.getElementById('art-toast');
  t.textContent = msg;
  t.style.background = type==='success' ? 'rgba(45,139,45,0.95)' : 'rgba(201,168,76,0.95)';
  t.style.color = type==='success' ? '#fff' : '#0a0a0a';
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2800);
}
