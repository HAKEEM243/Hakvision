<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Prière du culte | ELUCCO</title>
<meta name="description" content="C'est l'heure du culte. Rejoignez la communauté Masambukidiste en musique et en prière.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://elucco.pages.dev/culte-priere.html">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="elucco_logo_officiel.png">
<link rel="apple-touch-icon" href="elucco_logo_officiel.png">
<meta name="theme-color" content="#c9a84c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ELUCCO">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{
  --gold:#c9a84c;--gold-light:#f0d060;--gold-dark:#9a7a2c;
  --green:#1a5c1a;--green-light:#2d8b2d;
  --white:#f5f0e8;--off-white:#e8e0d0;
  --dark:#080810;--dark2:#0d0d20;
  --card-bg:rgba(255,255,255,0.04);
  --card-border:rgba(201,168,76,0.2);
  --radius:16px;--radius-lg:24px;
  --font-title:'Cinzel',serif;
  --font-body:'Crimson Text',serif;
  --font-ui:'Inter',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:16px}
body{
  background:var(--dark);color:var(--white);font-family:var(--font-body);
  overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.7;
  min-height:100vh;display:flex;flex-direction:column;
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{cursor:pointer;border:none;background:none;font-family:inherit}

.hdr{
  position:sticky;top:0;z-index:900;
  background:rgba(8,8,16,0.92);backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(201,168,76,0.18);
}
.hdr-inner{max-width:900px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.hdr-brand{display:flex;align-items:center;gap:12px}
.hdr-logo{width:38px;height:38px;object-fit:contain}
.hdr-title{font-family:var(--font-title);font-size:1.05rem;color:var(--gold);font-weight:900;letter-spacing:3px}
.hdr-back{
  display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:50px;
  background:rgba(201,168,76,0.1);border:1px solid rgba(201,168,76,0.3);
  color:var(--gold);font-family:var(--font-ui);font-size:0.75rem;font-weight:600;white-space:nowrap;
}

.wrap{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:36px 20px 60px;max-width:760px;margin:0 auto;text-align:center;
  background:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(201,168,76,0.1) 0%,transparent 65%);
}
.royal-ornament{display:flex;align-items:center;justify-content:center;gap:12px;max-width:260px;margin:0 auto 22px}
.royal-ornament .bar{height:1px;flex:1;background:linear-gradient(90deg,transparent,rgba(201,168,76,0.7))}
.royal-ornament .bar:last-child{background:linear-gradient(90deg,rgba(201,168,76,0.7),transparent)}
.royal-ornament .gem{width:8px;height:8px;flex:none;transform:rotate(45deg);background:linear-gradient(135deg,#f7e6a8,var(--gold));box-shadow:0 0 12px rgba(201,168,76,0.8)}
.royal-ornament .gem.sm{width:5px;height:5px;opacity:0.6}

.eyebrow{font-family:var(--font-ui);font-size:0.72rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
h1{font-family:var(--font-title);font-weight:900;font-size:clamp(1.7rem,5vw + 0.6rem,2.6rem);color:var(--white);margin-bottom:14px}
.sub{font-size:1.05rem;color:rgba(255,255,255,0.55);max-width:520px;margin:0 auto 36px}

.player-frame{
  position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--radius-lg);overflow:hidden;
  border:1px solid var(--card-border);box-shadow:0 30px 80px rgba(0,0,0,0.6);background:#000;
}
.player-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

.play-overlay{
  position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:radial-gradient(ellipse 80% 80% at 50% 50%,rgba(20,16,8,0.55),rgba(4,4,8,0.88)),
             url('sa_majeste_samuel_6_couronnement.jpg') center/cover;
  transition:opacity 0.4s ease;
}
.play-overlay.hidden{opacity:0;pointer-events:none}
.play-btn{
  width:88px;height:88px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),var(--gold-light));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 40px rgba(201,168,76,0.55);transition:transform 0.2s;
}
.play-btn:active{transform:scale(0.94)}
.play-btn i{font-size:2rem;color:var(--dark);margin-left:5px}
.play-label{font-family:var(--font-ui);font-size:0.85rem;font-weight:700;letter-spacing:1px;color:var(--white);text-shadow:0 2px 8px rgba(0,0,0,0.8)}

.status{margin-top:24px;font-family:var(--font-ui);font-size:0.8rem;color:rgba(255,255,255,0.4)}
.status i{color:var(--gold);margin-right:6px}

footer{border-top:1px solid rgba(201,168,76,0.15);padding:30px 20px;text-align:center;background:#050508}
.f-copy{font-family:var(--font-ui);font-size:0.72rem;color:rgba(255,255,255,0.25)}

@media(max-width:600px){ .hdr-title{font-size:0.9rem} }
@media (prefers-reduced-motion:reduce){ *{animation:none !important;scroll-behavior:auto !important} }
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-inner">
    <a href="index.html" class="hdr-brand">
      <img src="elucco_logo_officiel.png" alt="ELUCCO" class="hdr-logo">
      <div class="hdr-title">ELUCCO</div>
    </a>
    <a href="index.html" class="hdr-back"><i class="fas fa-arrow-left"></i> Retour au site</a>
  </div>
</header>

<main class="wrap">
  <div class="royal-ornament" aria-hidden="true"><span class="bar"></span><span class="gem sm"></span><span class="gem"></span><span class="gem sm"></span><span class="bar"></span></div>
  <p class="eyebrow">C'est l'heure du culte</p>
  <h1>Rejoignez la communauté en prière</h1>
  <p class="sub">Prenez un moment pour vous recueillir avec la communauté Masambukidiste, en musique.</p>

  <div class="player-frame" id="playerFrame">
    <div class="play-overlay" id="playOverlay">
      <button class="play-btn" id="playBtn" aria-label="Ecouter la priere"><i class="fas fa-play"></i></button>
      <div class="play-label">Écouter la prière</div>
    </div>
  </div>

  <p class="status" id="status"><i class="fas fa-music"></i> Appuyez pour commencer</p>
</main>

<footer>
  <p class="f-copy">© 2026 ELUCCO — Église Lumière du Christ au Congo</p>
</footer>

<script>
(function(){
  var VIDEO_ID = 'inpRzkJT_w8';
  var frame = document.getElementById('playerFrame');
  var overlay = document.getElementById('playOverlay');
  var btn = document.getElementById('playBtn');
  var status = document.getElementById('status');
  var player = null;
  var apiFailed = false;

  function onPlaying(){
    overlay.classList.add('hidden');
    status.innerHTML = '<i class="fas fa-music"></i> Priere en cours';
  }

  // Repli garanti : simple iframe avec autoplay, declenche uniquement
  // par l'appui (fonctionne meme si l'API YouTube ne charge pas).
  function fallbackPlay(){
    if(frame.querySelector('iframe')) { onPlaying(); return; }
    var iframe = document.createElement('iframe');
    iframe.src = 'https://www.youtube.com/embed/' + VIDEO_ID + '?autoplay=1&playsinline=1&rel=0';
    iframe.setAttribute('allow', 'autoplay; encrypted-media');
    iframe.setAttribute('allowfullscreen', '');
    frame.appendChild(iframe);
    onPlaying();
  }

  btn.addEventListener('click', function(){
    if(player && typeof player.playVideo === 'function'){
      player.playVideo();
      // L'evenement onStateChange confirmera la lecture ; par securite,
      // on masque aussi l'overlay immediatement au geste de l'utilisateur.
      onPlaying();
    } else {
      fallbackPlay();
    }
  });

  window.onYouTubeIframeAPIReady = function(){
    var host = document.createElement('div');
    host.id = 'ytHost';
    frame.insertBefore(host, overlay);
    player = new YT.Player('ytHost', {
      videoId: VIDEO_ID,
      playerVars: { autoplay: 1, playsinline: 1, rel: 0 },
      events: {
        onStateChange: function(e){ if(e.data === YT.PlayerState.PLAYING) onPlaying(); },
        onError: function(){ if(!frame.querySelector('iframe')) fallbackPlay(); }
      }
    });
  };

  var tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  tag.onerror = function(){ apiFailed = true; };
  document.head.appendChild(tag);

  // Si l'API n'a pas repondu (reseau lent/bloque), le bouton reste
  // pleinement fonctionnel via le repli direct.
  setTimeout(function(){ if(!player) apiFailed = true; }, 4000);
})();
</script>
</body>
</html>
