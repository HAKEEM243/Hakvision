<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chef d'État</title>
<meta name="description" content="Simulateur de chef d'État : dirigez n'importe quel pays du monde — économie, diplomatie, armée, ressources, institutions — avec un mode éditeur en bac à sable.">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%230b1220'/%3E%3Ccircle cx='50' cy='50' r='46' fill='none' stroke='%23c9a227' stroke-width='4'/%3E%3Ctext x='50' y='66' font-size='54' text-anchor='middle' fill='%23c9a227' font-family='Georgia,serif'%3E%E2%98%85%3C/text%3E%3C/svg%3E">
<style>
/* ============================================================
   TOKENS — palette "salle de commandement d'État", thème sombre
   assumé (voir design plan) : encre navy, parchemin, laiton.
   ============================================================ */
:root{
  --ink:#0a1120;
  --ink-2:#0e1729;
  --surface:#121b30;
  --surface-2:#1a2540;
  --surface-3:#22304f;
  --border:#2a3a5c;
  --border-soft:#1e2c48;
  --parchment:#eee6d3;
  --parchment-dim:#c9c2ab;
  --muted:#8d97ac;
  --muted-2:#69748c;
  --brass:#d3ac3a;
  --brass-soft:#8a7326;
  --brass-dim:#5c4f22;
  --seal-red:#c1503a;
  --seal-red-soft:#3a201c;
  --good:#4f9d6e;
  --good-soft:#183327;
  --warn:#d9822b;
  --warn-soft:#3a2712;
  --info:#5b8fc9;
  --shadow: 0 10px 30px -12px rgba(0,0,0,.6);
  --radius: 10px;
  --radius-lg: 16px;
  --font-display: "Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,"Times New Roman",serif;
  --font-body: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(211,172,58,.08), transparent 60%),
    radial-gradient(900px 500px at 110% 10%, rgba(91,143,201,.07), transparent 55%),
    var(--ink);
  color:var(--parchment);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
::selection{background:var(--brass-dim);color:var(--parchment);}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;text-wrap:balance;margin:0 0 .35em;color:var(--parchment);}
p{margin:0 0 .6em;color:var(--muted);line-height:1.5;}
a{color:var(--brass);}
button, select, input, textarea{font-family:inherit;font-size:14px;color:var(--parchment);}
.num{font-variant-numeric:tabular-nums;font-family:var(--font-mono);}
button{cursor:pointer;}
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--brass); outline-offset:2px;
}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

/* Scrollbars, subtle */
::-webkit-scrollbar{height:10px;width:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:8px;}

/* ============================================================
   LAYOUT SHELL
   ============================================================ */
#app{min-height:100vh;display:flex;flex-direction:column;}

.topbar{
  display:flex;align-items:center;gap:14px;
  padding:12px 18px;border-bottom:1px solid var(--border-soft);
  background:linear-gradient(180deg, var(--ink-2), var(--ink));
  position:sticky;top:0;z-index:20;
}
.seal{
  width:34px;height:34px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 32% 28%, #f3d878, var(--brass) 45%, var(--brass-soft) 78%, var(--brass-dim) 100%);
  border:1px solid var(--brass-dim);
  display:flex;align-items:center;justify-content:center;
  color:var(--ink);font-family:var(--font-display);font-weight:700;font-size:16px;
  box-shadow: inset 0 1px 2px rgba(255,255,255,.4), 0 2px 6px rgba(0,0,0,.4);
}
.brand{display:flex;flex-direction:column;line-height:1.1;}
.brand b{font-family:var(--font-display);font-size:16px;letter-spacing:.02em;}
.brand span{font-size:11px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.09em;}

.topbar .country-chip{
  display:flex;align-items:center;gap:8px;margin-left:8px;
  padding:5px 12px 5px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);
  font-size:13px;
}
.topbar .country-chip .flag{font-size:18px;}
.ticker{display:flex;gap:18px;margin-left:auto;align-items:center;}
.ticker .t-item{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;}
.ticker .t-item .l{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-2);}
.ticker .t-item .v{font-size:13px;font-weight:600;}
.pos{color:var(--good);} .neg{color:var(--seal-red);} .warn{color:var(--warn);}
.icon-btn{
  background:var(--surface-2);border:1px solid var(--border);color:var(--parchment);
  border-radius:8px;padding:7px 10px;font-size:12px;display:flex;align-items:center;gap:6px;
}
.icon-btn:hover{background:var(--surface-3);}
.icon-btn.on{background:var(--brass-dim);border-color:var(--brass-soft);color:var(--parchment);}

.shell{display:flex;flex:1;min-height:0;}
.sidenav{
  width:220px;flex:none;border-right:1px solid var(--border-soft);
  background:var(--ink-2);padding:14px 10px;display:flex;flex-direction:column;gap:2px;
}
.sidenav button{
  all:unset;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;
  color:var(--muted);font-size:13.5px;cursor:pointer;
}
.sidenav button .ic{width:20px;text-align:center;font-size:15px;}
.sidenav button:hover{background:var(--surface-2);color:var(--parchment);}
.sidenav button.active{background:var(--surface-2);color:var(--parchment);box-shadow:inset 3px 0 0 var(--brass);}
.sidenav .divider{height:1px;background:var(--border-soft);margin:10px 4px;}

main.view{flex:1;min-width:0;padding:22px 26px 90px;overflow-y:auto;}
.view h1{font-size:22px;}
.view .subtitle{margin-top:-6px;margin-bottom:18px;font-size:13px;color:var(--muted-2);}

/* Bottom tab bar for mobile */
.bottomnav{display:none;}

@media (max-width: 860px){
  .sidenav{display:none;}
  .ticker{display:none;}
  main.view{padding:16px 14px 84px;}
  .bottomnav{
    display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;
    background:var(--ink-2);border-top:1px solid var(--border-soft);
    overflow-x:auto;padding:6px 4px calc(6px + env(safe-area-inset-bottom));gap:2px;
  }
  .bottomnav button{
    all:unset;flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:6px 12px;border-radius:8px;color:var(--muted);font-size:10px;min-width:58px;text-align:center;
  }
  .bottomnav button .ic{font-size:17px;}
  .bottomnav button.active{color:var(--brass);}
}

/* ============================================================
   COMPONENTS
   ============================================================ */
.grid{display:grid;gap:14px;}
.grid.kpis{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));}
.grid.cols2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr));}
.card{
  background:linear-gradient(180deg, var(--surface), var(--surface) 60%, var(--surface-2));
  border:1px solid var(--border-soft);border-radius:var(--radius-lg);
  padding:16px 18px;box-shadow:var(--shadow);
}
.card h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:12px;font-family:var(--font-body);font-weight:600;}
.kpi .label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted-2);margin-bottom:6px;}
.kpi .value{font-family:var(--font-display);font-size:24px;font-variant-numeric:tabular-nums;}
.kpi .delta{font-size:11.5px;margin-top:4px;}

.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-soft);}
.row:last-child{border-bottom:none;}
.row .rl{color:var(--muted);font-size:13px;}
.row .rv{font-weight:600;font-size:13.5px;}

.btn{
  background:var(--surface-3);border:1px solid var(--border);color:var(--parchment);
  padding:9px 15px;border-radius:8px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;
}
.btn:hover{border-color:var(--brass-soft);}
.btn.primary{background:linear-gradient(180deg,#e2bd53,var(--brass));color:#231a04;border-color:var(--brass-soft);}
.btn.primary:hover{filter:brightness(1.06);}
.btn.danger{background:var(--seal-red-soft);border-color:var(--seal-red);color:#ffd9cf;}
.btn.ghost{background:transparent;}
.btn.sm{padding:6px 11px;font-size:12px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.02em;}
.pill.good{background:var(--good-soft);color:#8fe0ac;}
.pill.warn{background:var(--warn-soft);color:#f0b169;}
.pill.bad{background:var(--seal-red-soft);color:#ff9c88;}
.pill.info{background:#152640;color:#8fbaf0;}
.pill.neutral{background:var(--surface-3);color:var(--muted);}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.field label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.field .hint{font-size:11px;color:var(--muted-2);}
input[type=text], input[type=number], select, textarea{
  background:var(--ink-2);border:1px solid var(--border);border-radius:7px;padding:8px 10px;width:100%;
}
textarea{resize:vertical;min-height:60px;}
input[type=range]{width:100%;accent-color:var(--brass);}
.slider-row{display:flex;align-items:center;gap:10px;}
.slider-row .sv{width:44px;text-align:right;font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--brass);}

.bar{height:8px;border-radius:5px;background:var(--surface-3);overflow:hidden;}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--brass-soft),var(--brass));}
.bar.good > i{background:linear-gradient(90deg,#2f6b46,var(--good));}
.bar.bad > i{background:linear-gradient(90deg,#7a2c1e,var(--seal-red));}

.search{position:relative;margin-bottom:14px;}
.search input{padding-left:30px;}
.search::before{content:"⌕";position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted-2);}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-2);padding:8px 10px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);}
td{padding:8px 10px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
tr:hover td{background:var(--surface-2);}
.table-wrap{max-height:60vh;overflow:auto;border:1px solid var(--border-soft);border-radius:var(--radius-lg);}

.log{display:flex;flex-direction:column-reverse;gap:8px;max-height:280px;overflow-y:auto;}
.log .entry{font-size:12.5px;color:var(--muted);padding:8px 10px;background:var(--surface-2);border-left:2px solid var(--brass-soft);border-radius:0 6px 6px 0;}
.log .entry .tag{color:var(--parchment-dim);}
.log .entry time{display:block;font-size:10px;color:var(--muted-2);margin-top:2px;}

.tabs-inline{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.tabs-inline button{
  all:unset;padding:7px 13px;border-radius:8px;font-size:12.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border-soft);cursor:pointer;
}
.tabs-inline button.active{background:var(--brass-dim);color:var(--parchment);border-color:var(--brass-soft);}

.city-card{border:1px solid var(--border-soft);border-radius:10px;padding:12px;background:var(--surface-2);}
.city-card h4{font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.infra-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;font-size:12px;}
.infra-grid .ig{display:flex;justify-content:space-between;background:var(--ink-2);padding:6px 8px;border-radius:6px;}

.editor-banner{
  background:var(--seal-red-soft);border:1px solid var(--seal-red);color:#ffcabf;
  padding:10px 14px;border-radius:10px;font-size:12.5px;margin-bottom:16px;display:flex;gap:10px;align-items:center;
}

.empty{text-align:center;padding:40px 20px;color:var(--muted-2);}

/* ---------- Country select screen ---------- */
.select-screen{width:100%;max-width:1080px;margin:0 auto;padding:40px 20px 70px;}
.select-hero{text-align:center;margin-bottom:30px;}
.select-hero .seal-big{
  width:76px;height:76px;border-radius:50%;margin:0 auto 16px;
  background:radial-gradient(circle at 32% 28%, #f6e19a, var(--brass) 45%, var(--brass-soft) 78%, var(--brass-dim) 100%);
  border:2px solid var(--brass-dim); display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:34px;color:var(--ink);
  box-shadow: inset 0 2px 4px rgba(255,255,255,.45), 0 6px 20px rgba(0,0,0,.5);
}
.select-hero h1{font-size:30px;}
.select-hero p{max-width:520px;margin:0 auto;}
.continent-group{margin-bottom:22px;}
.continent-group h3{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted-2);margin:0 0 10px 2px;}
.country-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;}
.country-card{
  background:var(--surface);border:1px solid var(--border-soft);border-radius:10px;padding:12px;text-align:left;
  display:flex;flex-direction:column;gap:6px;
}
.country-card:hover{border-color:var(--brass-soft);background:var(--surface-2);}
.country-card .cflag{font-size:26px;}
.country-card .cname{font-weight:600;font-size:13.5px;}
.country-card .cmeta{font-size:11px;color:var(--muted-2);}
.resume-bar{
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--brass-soft);border-radius:12px;padding:14px 18px;margin-bottom:26px;
}

.toast-wrap{position:fixed;bottom:16px;right:16px;z-index:50;display:flex;flex-direction:column;gap:8px;max-width:320px;}
.toast{background:var(--surface-3);border:1px solid var(--brass-soft);border-radius:10px;padding:10px 14px;font-size:12.5px;box-shadow:var(--shadow);animation:toastin .25s ease-out;}
@keyframes toastin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

@media (max-width:600px){
  .topbar{padding:10px 12px;gap:8px;flex-wrap:wrap;row-gap:8px;}
  .brand span{display:none;}
  .country-chip{margin-left:0;}
  .icon-btn{padding:6px 9px;font-size:11px;}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts" class="toast-wrap"></div>

function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashCode(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (Math.imul(31,h) + str.charCodeAt(i)) | 0; }
  return h;
}
function rngFor(id){ return mulberry32(hashCode(id)); }
function rand(rng,min,max){ return min + rng()*(max-min); }
function randInt(rng,min,max){ return Math.floor(rand(rng,min,max+1)); }
function pick(rng,arr){ return arr[Math.floor(rng()*arr.length)]; }
function pickN(rng,arr,n){
  const pool = arr.slice(); const out=[];
  n = Math.min(n, pool.length);
  for(let i=0;i<n;i++){ const idx = Math.floor(rng()*pool.length); out.push(pool.splice(idx,1)[0]); }
  return out;
}
function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
function round1(v){ return Math.round(v*10)/10; }
function fmtNum(n){
  n = Number(n)||0;
  const s = n<0 ? '-' : '';
  n = Math.abs(n);
  if(n>=1e9) return s+round1(n/1e9)+' Md';
  if(n>=1e6) return s+round1(n/1e6)+' M';
  if(n>=1e3) return s+round1(n/1e3)+' k';
  return s+Math.round(n);
}
function fmtMoney(n){ return fmtNum(n)+' $'; }
function fmtPct(n){ return round1(Number(n)||0)+' %'; }
function flagEmoji(iso2){
  if(!iso2 || iso2.length!==2) return '\u{1F3F3}\u{FE0F}';
  return String.fromCodePoint(...[...iso2.toUpperCase()].map(c=>127397+c.charCodeAt(0)));
}
function uid(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,9); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function getPath(obj,path){ return path.split('.').reduce((o,k)=> (o==null?o:o[k]), obj); }
function setPath(obj,path,value){
  const parts = path.split('.'); let o=obj;
  for(let i=0;i<parts.length-1;i++) o = o[parts[i]];
  o[parts[parts.length-1]] = value;
}

  {msg:c=>`Une catastrophe naturelle endommage des infrastructures locales.`, fx:(c,rng)=>{ damageInfra(c,rng); c.economy.approval-=rand(rng,2,5);}},
  {msg:c=>`Une récolte exceptionnelle fait baisser les prix.`, fx:(c,rng)=>{c.economy.inflation-=rand(rng,.3,1); c.economy.approval+=rand(rng,.5,1.5);}},
  {msg:c=>`Une cyberattaque perturbe des services publics.`, fx:(c,rng)=>{c.economy.approval-=rand(rng,1,3); c.police.crimeIndex+=rand(rng,1,3);}},
  {msg:c=>`Un prix international distingue les avancées du pays.`, fx:(c,rng)=>{c.economy.approval+=rand(rng,1,3);}},
];
const GAME_START = new Date(Date.UTC(2026,8,1));
const MONTHS_FR = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function turnDateLabel(turn){
  const d = new Date(GAME_START); d.setUTCMonth(d.getUTCMonth()+turn);
  return `${MONTHS_FR[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
}

/* ============================================================
   COUNTRY GENERATION
   ============================================================ */
function makeCity(idBase, name, pop, coastal, isCapital, rng){
  return {
    id: idBase+'-'+uid('c'),
    name, population: Math.round(pop), coastal: !!coastal, isCapital: !!isCapital,
    infra: { roads: randInt(rng,15,55), highways: randInt(rng,0,3), airports: isCapital?1:(coastal? randInt(rng,0,1):0), ports: (coastal && rng()>.5)?1:0 },
  };
}
function generateResources(base, rng){
  if(base.id === DRC_ID){
    return DRC_RESOURCE_TYPES.map(type=>{
      const def = RESOURCE_POOL.find(r=>r.type===type);
      return { id: uid('res'), type, name: def.name, amount: randInt(rng,4000,20000), price: def.price, exploited:true };
    });
  }
  const n = randInt(rng,2,4);
  const chosen = pickN(rng, RESOURCE_POOL, n);
  return chosen.map(def=>({ id: uid('res'), type: def.type, name: def.name, amount: randInt(rng,500,8000), price: def.price, exploited:true }));
}
function generateCompanies(base, rng){
  const n = randInt(rng,2,4);
  const sectors = pickN(rng, COMPANY_SECTORS, n);
  return sectors.map(sector=>({
    id: uid('co'), name: sector+' '+pick(rng,['Group','National','Holding','& Associés','Corp']),
    sector, ownership: rng()>.5?'public':'privée', value: Math.round(rand(rng, base.gdp*1e6*0.5, base.gdp*1e6*3)),
  }));
}
function deriveCountry(id){
  const base = COUNTRY_INDEX[id];
  const rng = rngFor(id);
  let cities;
  if(id === DRC_ID){
    cities = DRC_CITIES.map(c=>makeCity(id,c.name,c.pop,c.coastal,c.capital,rng));
  } else {
    cities = [ makeCity(id, base.capital, base.pop*rand(rng,.08,.22), !base.landlocked, true, rng) ];
  }
  const capitalCity = cities.find(c=>c.isCapital) || cities[0];
  const treasuryBase = base.gdp*1e9*rand(rng,.04,.10);
  return {
    id: base.id, iso2: base.iso2, name: base.name, continent: base.continent,
    population: base.pop, area: base.area, gdp: base.gdp, landlocked: !!base.landlocked,
    regime: 'République',
    anthem: { name: `Hymne national`, desc: `Chant patriotique de ${base.name}.` },
    government: { pm: 'Poste vacant', ministers: Object.fromEntries(MINISTRIES.map(m=>[m.key,'Poste vacant'])) },
    mandate: { turnsElapsed: 0, length: 48, term: 1 },
    capitalCityId: capitalCity.id,
    cities,
    budget: {
      treasury: Math.round(treasuryBase),
      taxIncome: randInt(rng,18,32), taxCorporate: randInt(rng,15,30),
      spending: { sante: randInt(rng,30,60), education: randInt(rng,30,60), defense: randInt(rng,20,50), police: randInt(rng,20,50), social: randInt(rng,30,60), infra: randInt(rng,20,55) },
    },
    economy: {
      growth: round1(rand(rng,-1,4)), unemployment: round1(rand(rng,3,22)),
      inflation: round1(rand(rng,1,12)), approval: round1(rand(rng,38,64)),
    },
    resources: generateResources(base, rng),
    military: { troops: Math.round(base.pop*rand(rng,.0015,.006)), arms: randInt(rng,15,70) },
    police: { officers: Math.round(base.pop*rand(rng,.001,.004)), equipment: randInt(rng,15,70), crimeIndex: round1(rand(rng,10,60)) },
    social: {
      immigration: pick(rng,['ouverte','quotas','fermee']), visaQuota: randInt(rng,5,80)*1000,
      pensionLevel: randInt(rng,30,65), unemploymentBenefit: randInt(rng,20,60),
      healthIndex: round1(rand(rng,35,80)), educationIndex: round1(rand(rng,35,80)),
    },
    companies: generateCompanies(base, rng),
    log: [ {msg:`Prise de fonction à la tête de ${base.name}.`, turn:0} ],
  };
}

/* ============================================================
   STATE & PERSISTENCE
   ============================================================ */
const SAVE_KEY = 'president-sim-save-v1';
let state = null;

function newGame(countryId){
  state = {
    screen: 'game', activeTab: 'dashboard', editMode: false, editorTargetId: countryId,
    player: { countryId, turn: 0 }, countries: {}, relations: {}, contracts: [], diploFilter: '',
    startedAt: Date.now(),
  };
  COUNTRIES_DATA.forEach(c=> state.countries[c.id] = deriveCountry(c.id));
  saveGame();
}
function saveGame(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){} }
function loadGame(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    state = JSON.parse(raw);
    if(!state.diploFilter) state.diploFilter = '';
    return true;
  }catch(e){ return false; }
}
function hasSave(){ try{ return !!localStorage.getItem(SAVE_KEY); }catch(e){ return false; } }
function resetGame(){
  if(!confirm('Recommencer une nouvelle partie ? La partie en cours sera perdue (pensez à l’exporter avant).')) return;
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  state = { screen:'select' };
  render();
}
function exportSave(){
  const blob = new Blob([JSON.stringify(state)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `sauvegarde-${slugifyName(countryName(state.player.countryId))}-tour${state.player.turn}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  toast('Sauvegarde exportée.');
}
function slugifyName(s){ return String(s).toLowerCase().normalize('NFKD').replace(/[^\w]+/g,'-'); }
function importSaveFile(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed || !parsed.player || !parsed.countries) throw new Error('invalid');
      state = parsed; saveGame(); render(); toast('Sauvegarde importée.');
    }catch(e){ toast('Fichier de sauvegarde invalide.'); }
  };
  reader.readAsText(file);
}
function getCountryQuiet(id){ return state.countries[id]; }
function playerState(){ return state.countries[state.player.countryId]; }
function countryName(id){
  if(state && state.countries && state.countries[id]) return state.countries[id].name;
  return (COUNTRY_INDEX[id]||{}).name || id;
}
function cityById(c,id){ return c.cities.find(x=>x.id===id) || c.cities[0]; }

/* ============================================================
   SIMULATION ENGINE
   ============================================================ */
function avgRelationScore(id){
  const keys = Object.keys(state.relations).filter(k=>k.split('|').includes(id));
  if(!keys.length) return 50;
  return keys.reduce((a,k)=>a+state.relations[k].score,0)/keys.length;
}
function totalInfraCount(c){
  return c.cities.reduce((a,city)=> a + Math.round(city.infra.roads/20) + city.infra.highways + city.infra.airports + city.infra.ports, 0);
}
function discoverResource(c, rng){
  if(rng() < 0.5 && c.resources.length){
    const r = pick(rng, c.resources);
    r.amount = Math.round(r.amount * rand(rng,1.15,1.4));
  } else {
    const existingTypes = c.resources.map(r=>r.type);
    const options = RESOURCE_POOL.filter(r=>!existingTypes.includes(r.type));
    if(options.length){
      const def = pick(rng, options);
      c.resources.push({ id: uid('res'), type: def.type, name: def.name, amount: randInt(rng,1000,6000), price: def.price, exploited:true });
    } else if(c.resources.length){
      const r = pick(rng, c.resources);
      r.amount = Math.round(r.amount * 1.1);
    }
  }
}
function damageInfra(c, rng){
  const city = pick(rng, c.cities);
  city.infra.roads = clamp(city.infra.roads - randInt(rng,5,15), 0, 100);
}
function pushLog(msg, c){
  c = c || playerState();
  c.log.push({ msg, turn: state.player.turn });
  if(c.log.length > 60) c.log.shift();
}
function simulateCountry(c, isPlayer, turn){
  const rng = mulberry32((hashCode(c.id) ^ (turn*2654435761)) >>> 0);
  const avgTax = (c.budget.taxIncome + c.budget.taxCorporate)/2;
  const revenue = c.gdp*1e9/12*0.26*(avgTax/50);
  const sectors=['sante','education','defense','police','social','infra'];
  const avgSpend = sectors.reduce((a,s)=>a+c.budget.spending[s],0)/sectors.length;
  const spending = c.gdp*1e9/12*0.26*(avgSpend/50);
  const resourceIncome = c.resources.reduce((a,r)=> a + (r.exploited ? r.amount*r.price*0.02 : 0), 0);
  const companyIncome = c.companies.reduce((a,co)=> a + (co.ownership==='public' ? co.value*0.02 : 0), 0);
  const infraMaint = totalInfraCount(c) * 400000;
  if(isPlayer){
    c.budget.treasury += revenue - spending + resourceIncome + companyIncome - infraMaint;
  }
  let gd = 0;
  gd += (c.budget.spending.infra-50)/450;
  gd += (c.social.educationIndex-50)/900;
  gd += (avgRelationScore(c.id)-50)/1800;
  gd += rand(rng,-1,1)*0.35;
  c.economy.growth = round1(clamp(c.economy.growth*0.85 + gd, -9, 13));
  c.gdp = Math.max(0.05, c.gdp * (1 + c.economy.growth/100/12));
  let ud = -c.economy.growth*0.06 - (c.budget.spending.social-50)/60 + rand(rng,-.4,.4);
  c.economy.unemployment = round1(clamp(c.economy.unemployment+ud, 1, 45));
  let idl = rand(rng,-.35,.35) + (c.budget.treasury<0 ? 0.4 : 0);
  c.economy.inflation = round1(clamp(c.economy.inflation+idl, -2, 70));
  let cd = -(c.budget.spending.police-50)*0.025 + (c.economy.unemployment-10)*0.045 + rand(rng,-.6,.6);
  c.police.crimeIndex = round1(clamp(c.police.crimeIndex+cd, 0, 100));
  c.social.healthIndex = round1(clamp(c.social.healthIndex + ((c.budget.spending.sante-50)/40) + rand(rng,-.3,.3), 0, 100));
  c.social.educationIndex = round1(clamp(c.social.educationIndex + ((c.budget.spending.education-50)/40) + rand(rng,-.3,.3), 0, 100));
  let ad = 0;
  ad -= (c.economy.unemployment-10)*0.13;
  ad -= Math.max(0,c.economy.inflation-5)*0.09;
  ad += (c.social.healthIndex-50)*0.045;
  ad += (c.social.educationIndex-50)*0.045;
  ad -= (c.police.crimeIndex-30)*0.045;
  ad += c.economy.growth*0.28;
  ad += (c.budget.treasury>=0?0.25:-0.5);
  ad += rand(rng,-1.3,1.3);
  c.economy.approval = round1(clamp(c.economy.approval+ad, 0, 100));
  let gr = 0.0014;
  if(c.social.immigration==='ouverte') gr += 0.0009;
  if(c.social.immigration==='fermee') gr -= 0.0003;
  c.population = Math.max(1000, Math.round(c.population*(1+gr)));
  if(isPlayer && rng() < 0.22){
    const ev = pick(rng, EVENTS);
    ev.fx(c, rng);
    pushLog(ev.msg(c), c);
  }
  if(isPlayer){
    c.mandate.turnsElapsed++;
    if(c.mandate.turnsElapsed >= c.mandate.length){
      c.mandate.turnsElapsed = 0; c.mandate.term++;
      if(c.economy.approval >= 38){
        c.economy.approval = clamp(c.economy.approval+3,0,100);
        pushLog(`Fin de mandat : la population reconduit votre gouvernement pour un nouveau mandat.`, c);
      } else {
        c.economy.approval = clamp(c.economy.approval+12,0,100);
        c.police.crimeIndex = clamp(c.police.crimeIndex+6,0,100);
        pushLog(`Fin de mandat mouvementée : des contestations éclatent, mais vous restez en fonction pour un nouveau mandat.`, c);
      }
    }
  }
}
function processContracts(){
  state.contracts = state.contracts.filter(ct=>{
    const involvesPlayer = ct.a === state.player.countryId || ct.b === state.player.countryId;
    if(involvesPlayer) playerState().budget.treasury += ct.income;
    ct.turnsLeft--;
    if(ct.turnsLeft <= 0){
      if(involvesPlayer) pushLog(`Le contrat avec ${countryName(ct.a===state.player.countryId?ct.b:ct.a)} est arrivé à son terme.`);
      return false;
    }
    return true;
  });
}
function advanceTurn(){
  state.player.turn++;
  const p = playerState();
  simulateCountry(p, true, state.player.turn);
  Object.values(state.countries).forEach(c=>{ if(c.id!==p.id) simulateCountry(c,false,state.player.turn); });
  processContracts();
  saveGame();
  render();
}

/* ============================================================
   ACTIONS — Diplomacy
   ============================================================ */
function relKey(a,b){ return [a,b].sort().join('|'); }
function getRelation(a,b){ return state.relations[relKey(a,b)] || {score:50, status:'paix'}; }
function setRelation(a,b,patch){
  const k = relKey(a,b);
  state.relations[k] = Object.assign({score:50,status:'paix'}, state.relations[k], patch);
}
function addContract(a,b){
  const income = Math.round((getCountryQuiet(a).gdp + getCountryQuiet(b).gdp) * 1e9 * 0.00004);
  state.contracts.push({ id: uid('ct'), a, b, income, turnsLeft: randInt(mulberry32(randSeed()), 12, 30) });
}
function diploAction(otherId, action){
  const player = state.player.countryId;
  const rel = getRelation(player, otherId);
  let score = rel.score, status = rel.status;
  const oName = countryName(otherId);
  let msg = '';
  if(action==='alliance'){
    if(status==='guerre'){ msg = `Impossible de proposer une alliance : vous êtes en guerre avec ${oName}.`; }
    else if(score < 55){ msg = `${oName} refuse l'alliance : les relations sont trop tendues (score requis : 55).`; }
    else { status='alliance'; score=clamp(score+12,0,100); msg = `Alliance conclue avec ${oName}.`; }
  } else if(action==='commerce'){
    if(status==='guerre'){ msg = `Impossible de commercer avec un pays en guerre.`; }
    else { if(status==='paix') status='accord commercial'; score=clamp(score+6,0,100);
      addContract(player, otherId); msg = `Accord commercial signé avec ${oName}.`; }
  } else if(action==='aide'){
    const cost = playerState().gdp*1e9*0.003;
    if(playerState().budget.treasury < cost){ msg = `Trésor insuffisant pour envoyer une aide (${fmtMoney(cost)} nécessaires).`; }
    else { playerState().budget.treasury -= cost; score=clamp(score+15,0,100); msg = `Aide de ${fmtMoney(cost)} envoyée à ${oName}.`; }
  } else if(action==='sanctions'){
    status='sanctions'; score=clamp(score-15,0,100); msg = `Sanctions économiques imposées à ${oName}.`;
  } else if(action==='guerre'){
    status='guerre'; score=clamp(score-45,0,100); playerState().economy.approval=clamp(playerState().economy.approval-4,0,100);
    msg = `Déclaration de guerre à ${oName} !`;
  } else if(action==='paix'){
    status='paix'; score=clamp(score+8,0,100); msg = `Retour à la paix avec ${oName}.`;
  }
  setRelation(player, otherId, {score, status});
  pushLog(msg);
  saveGame();
  refreshDiplomacyTable();
  refreshTicker();
}
function setDiploFilter(v){
  state.diploFilter = v;
  refreshDiplomacyTable();
}
function refreshDiplomacyTable(){
  const tbody = document.getElementById('diploTbody');
  if(!tbody) return;
  tbody.innerHTML = diplomacyRows();
}

   ACTIONS — Economy
   ============================================================ */
function setTax(field, value){ playerState().budget[field] = clamp(Math.round(value),0,80); saveGame(); render(); }
function setSpending(field, value){ playerState().budget.spending[field] = clamp(Math.round(value),0,100); saveGame(); render(); }
function toggleExploit(resId){
  const r = playerState().resources.find(x=>x.id===resId);
  r.exploited = !r.exploited; saveGame(); render();
}
function prospect(){
  const c = playerState();
  const cost = c.gdp*1e9*0.002;
  if(c.budget.treasury<cost){ toast('Trésor insuffisant pour une campagne de prospection.'); return; }
  c.budget.treasury -= cost;
  discoverResource(c, mulberry32(randSeed()));
  pushLog(`Une campagne de prospection est lancée sur le territoire.`, c);
  saveGame(); render();
}
function foundCompany(name, sector, ownership){
  const c = playerState();
  const cost = c.gdp*1e6*2;
  if(c.budget.treasury<cost){ toast('Trésor insuffisant pour fonder cette entreprise.'); return; }
  c.budget.treasury -= cost;
  c.companies.push({ id: uid('co'), name: (name||'').trim()||`${sector} Nationale`, sector, ownership, value: Math.round(cost) });
  pushLog(`Fondation de l'entreprise « ${(name||'').trim()||sector} ».`, c);
  saveGame(); render();
}

/* ============================================================
   ACTIONS — Infrastructure / Government / Security / Social
   ============================================================ */
function buildInfra(cityId, typeKey){
  const c = playerState();
  const city = c.cities.find(x=>x.id===cityId);
  const type = INFRA_TYPES.find(t=>t.key===typeKey);
  if(type.requiresCoastal && !city.coastal){ toast(`${city.name} n'a pas d'accès maritime ou fluvial : port impossible.`); return; }
  if(type.key==='roads' && city.infra.roads>=100){ toast('Réseau routier déjà au maximum.'); return; }
  if(c.budget.treasury < type.cost){ toast(`Trésor insuffisant (${fmtMoney(type.cost)} nécessaires).`); return; }
  c.budget.treasury -= type.cost;
  if(type.key==='roads') city.infra.roads = clamp(city.infra.roads+type.step,0,100);
  else city.infra[type.key] += type.step;
  c.economy.approval = clamp(c.economy.approval+0.6,0,100);
  pushLog(`${type.label} amélioré à ${city.name}.`, c);
  saveGame(); render();
}
function setRegime(regime){
  const c = playerState();
  c.regime = regime;
  c.economy.approval = clamp(c.economy.approval + rand(mulberry32(randSeed()),-3,3), 0, 100);
  pushLog(`Changement de régime politique : ${regime}.`, c);
  saveGame(); render();
}
function setCabinet(pm, ministers){
  const c = playerState();
  c.government.pm = (pm||'').trim() || 'Poste vacant';
  MINISTRIES.forEach(m=>{ c.government.ministers[m.key] = (ministers[m.key]||'').trim() || 'Poste vacant'; });
  pushLog(`Le gouvernement est renouvelé.`, c);
  saveGame(); render();
}
function setAnthem(name, desc){
  const c = playerState();
  c.anthem = { name: (name||'').trim() || c.anthem.name, desc: (desc||'').trim() || c.anthem.desc };
  pushLog(`Nouvel hymne national adopté : « ${c.anthem.name} ».`, c);
  saveGame(); render();
}
function setCapital(cityId){
  const c = playerState();
  c.cities.forEach(x=>x.isCapital = (x.id===cityId));
  c.capitalCityId = cityId;
  pushLog(`${cityById(c,cityId).name} devient la nouvelle capitale.`, c);
  saveGame(); render();
}
function recruit(kind){
  const c = playerState();
  if(kind==='police'){
    const cost = 8000*200;
    if(c.budget.treasury<cost){ toast('Trésor insuffisant.'); return; }
    c.budget.treasury -= cost; c.police.officers += 200;
    pushLog('200 policiers supplémentaires recrutés.', c);
  } else {
    const cost = 15000*300;
    if(c.budget.treasury<cost){ toast('Trésor insuffisant.'); return; }
    c.budget.treasury -= cost; c.military.troops += 300;
    pushLog('300 soldats supplémentaires enrôlés.', c);
  }
  saveGame(); render();
}
function modernize(kind){
  const c = playerState();
  const cost = c.gdp*1e9*0.006;
  if(c.budget.treasury<cost){ toast('Trésor insuffisant.'); return; }
  c.budget.treasury -= cost;
  if(kind==='police') c.police.equipment = clamp(c.police.equipment+8,0,100);
  else c.military.arms = clamp(c.military.arms+8,0,100);
  pushLog(kind==='police' ? "Modernisation de l'équipement policier." : "Modernisation de l'arsenal militaire.", c);
  saveGame(); render();
}
function setImmigration(policy){ playerState().social.immigration = policy; saveGame(); render(); }
function setVisaQuota(v){ playerState().social.visaQuota = clamp(Math.round(v),0,2000000); saveGame(); render(); }
function setSocialLevel(field, v){ playerState().social[field] = clamp(Math.round(v),0,100); saveGame(); render(); }

function editAddCity(countryId, name, pop, coastal){
  const c = getCountryQuiet(countryId);
  c.cities.push(makeCity(countryId, (name||'Nouvelle ville').trim(), Math.round(pop)||10000, !!coastal, false, mulberry32(randSeed())));
  saveGame(); render();
}

/* ============================================================
   UI HELPERS
   ============================================================ */
function toast(msg){
  const wrap = document.getElementById('toasts');
  if(!wrap) return;
  const el = document.createElement('div');
  el.className='toast'; el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=> el.remove(), 3600);
}
function sliderRow(label, value, min, max, onChangeExpr, unit){
  return `<div class="field"><label>${label}</label>
    <div class="slider-row">
      <input type="range" min="${min}" max="${max}" value="${value}" oninput="this.nextElementSibling.textContent=this.value+'${unit}'" onchange="${onChangeExpr}">
      <span class="sv">${value}${unit}</span>
    </div></div>`;
}
function editNumber(countryId, path, label){
  const v = getPath(getCountryQuiet(countryId), path);
  return `<div class="field"><label>${label}</label><input type="number" value="${v}" onchange="editField('${countryId}','${path}',this.value,'number')"></div>`;
}
function editText(countryId, path, label){
  const v = getPath(getCountryQuiet(countryId), path);
  return `<div class="field"><label>${label}</label><input type="text" value="${escapeHtml(v)}" onchange="editField('${countryId}','${path}',this.value,'text')"></div>`;
}
function editSelect(countryId, path, label, options){
  const v = getPath(getCountryQuiet(countryId), path);
  return `<div class="field"><label>${label}</label><select onchange="editField('${countryId}','${path}',this.value,'text')">${options.map(o=>`<option ${o===v?'selected':''}>${escapeHtml(o)}</option>`).join('')}</select></div>`;
}
function statusPill(status){
  const map = { paix:['neutral','Paix'], alliance:['good','Alliance'], 'accord commercial':['info','Accord commercial'], sanctions:['warn','Sanctions'], guerre:['bad','Guerre'] };
  const pair = map[status] || ['neutral', status];
  return `<span class="pill ${pair[0]}">${pair[1]}</span>`;
}
function activeContracts(){ return state.contracts.filter(ct=>ct.a===state.player.countryId||ct.b===state.player.countryId); }
function tabGlyph(id){
  return {dashboard:'◆',economy:'$',resources:'⛏',diplomacy:'✦',social:'♥',security:'⛨',infra:'⌂',government:'⚖',editor:'✎'}[id]||'•';
}

/* ============================================================
   RENDERING — screens
   ============================================================ */
function render(){
  const app = document.getElementById('app');
  if(!state || state.screen==='select'){
    app.innerHTML = renderSelectScreen();
    return;
  }
  app.innerHTML = renderShell();
}
function renderSelectScreen(){
  const groups = {};
  COUNTRIES_DATA.forEach(c=>{ (groups[c.continent] = groups[c.continent]||[]).push(c); });
  const order = ['Afrique','Amérique du Nord','Amérique du Sud','Asie','Europe','Océanie'];
  let resumeHtml = '';
  if(hasSave()){
    resumeHtml = `<div class="resume-bar">
      <div><b>Une partie est en cours.</b><div style="color:var(--muted);font-size:12px;margin-top:2px;">Reprenez où vous en étiez, ou choisissez un nouveau pays ci-dessous pour recommencer.</div></div>
      <button class="btn primary" onclick="resumeGame()">Reprendre la partie</button>
    </div>`;
  }
  const groupsHtml = order.filter(o=>groups[o]).map(cont=>{
    const cards = groups[cont].slice().sort((a,b)=>a.name.localeCompare(b.name)).map(c=>`
      <button class="country-card" onclick="confirmStart('${c.id}')">
        <div class="cflag">${flagEmoji(c.iso2)}</div>
        <div class="cname">${escapeHtml(c.name)}</div>
        <div class="cmeta">${escapeHtml(c.capital)} · ${fmtNum(c.pop)} hab.</div>
      </button>`).join('');
    return `<div class="continent-group"><h3>${cont} (${groups[cont].length})</h3><div class="country-grid">${cards}</div></div>`;
  }).join('');
  return `<div class="select-screen">
    <div class="select-hero">
      <div class="seal-big">★</div>
      <h1>Chef d'État</h1>
      <p>Choisissez l'un des 195 pays du monde et prenez la tête de son gouvernement : économie, diplomatie, armée, ressources, institutions. Un mode Éditeur permet de tout façonner librement, en bac à sable.</p>
    </div>
    ${resumeHtml}
    ${groupsHtml}
  </div>`;
}
function confirmStart(id){
  if(hasSave()){
    if(!confirm(`Démarrer une nouvelle partie à la tête de ${(COUNTRY_INDEX[id]||{}).name||id} effacera la sauvegarde existante. Continuer ?`)) return;
  }
  newGame(id);
  render();
}
function resumeGame(){ loadGame(); render(); }

function renderShell(){
  const p = playerState();
  return `
  <div class="topbar">
    <div class="seal">★</div>
    <div class="brand"><b>Chef d'État</b><span>Simulateur géopolitique</span></div>
    <div class="country-chip"><span class="flag">${flagEmoji(p.iso2)}</span><span>${escapeHtml(p.name)}</span></div>
    <div class="ticker" id="ticker">${tickerHtml(p)}</div>
    <button class="icon-btn ${state.editMode?'on':''}" onclick="toggleEditMode()">${state.editMode?'✓ Éditeur actif':'Mode Éditeur'}</button>
    <button class="icon-btn" onclick="exportSave()">Exporter</button>
    <label class="icon-btn" style="position:relative;overflow:hidden;">Importer<input type="file" accept="application/json" onchange="importSaveFile(this.files[0])" style="position:absolute;inset:0;opacity:0;cursor:pointer;"></label>
    <button class="icon-btn" onclick="resetGame()">Nouvelle partie</button>
  </div>
  <div class="shell">
    <nav class="sidenav">
      ${TABS.map(t=>`<button class="${state.activeTab===t.id?'active':''}" onclick="setTab('${t.id}')"><span class="ic">${tabGlyph(t.id)}</span>${t.label}</button>`).join('')}
    </nav>
    <main class="view" id="mainView">${renderTab()}</main>
  </div>
  <nav class="bottomnav">
    ${TABS.map(t=>`<button class="${state.activeTab===t.id?'active':''}" onclick="setTab('${t.id}')"><span class="ic">${tabGlyph(t.id)}</span>${t.label}</button>`).join('')}
  </nav>`;
}
function tickerHtml(p){
  const treasuryClass = p.budget.treasury>=0 ? 'pos':'neg';
  const approvalClass = p.economy.approval>=50?'pos':(p.economy.approval>=30?'warn':'neg');
  return `
    <div class="t-item"><span class="l">Date</span><span class="v">${turnDateLabel(state.player.turn)}</span></div>
    <div class="t-item"><span class="l">Trésor</span><span class="v num ${treasuryClass}">${fmtMoney(p.budget.treasury)}</span></div>
    <div class="t-item"><span class="l">Popularité</span><span class="v num ${approvalClass}">${fmtPct(p.economy.approval)}</span></div>`;
}
function refreshTicker(){
  const el = document.getElementById('ticker');
  if(el) el.innerHTML = tickerHtml(playerState());
}
function setTab(t){ state.activeTab = t; render(); }
function renderTab(){
  switch(state.activeTab){
    case 'dashboard': return renderDashboard();
    case 'economy': return renderEconomy();
    case 'resources': return renderResources();
    case 'diplomacy': return renderDiplomacy();
    case 'social': return renderSocial();
    case 'security': return renderSecurity();
    case 'infra': return renderInfra();
    case 'government': return renderGovernment();
    case 'editor': return renderEditor();
    default: return '';
  }
}

/* ---- Dashboard ---- */
function renderDashboard(){
  const c = playerState();
  const mandatePct = Math.round(c.mandate.turnsElapsed / c.mandate.length * 100);
  const kpis = [
    {label:'Trésor public', value: fmtMoney(c.budget.treasury), cls: c.budget.treasury>=0?'pos':'neg'},
    {label:'Croissance du PIB', value: fmtPct(c.economy.growth), cls: c.economy.growth>=0?'pos':'neg'},
    {label:'Chômage', value: fmtPct(c.economy.unemployment), cls: c.economy.unemployment<12?'pos':(c.economy.unemployment<22?'warn':'neg')},
    {label:'Inflation', value: fmtPct(c.economy.inflation), cls: c.economy.inflation<6?'pos':(c.economy.inflation<15?'warn':'neg')},
    {label:'Popularité', value: fmtPct(c.economy.approval), cls: c.economy.approval>=50?'pos':(c.economy.approval>=30?'warn':'neg')},
    {label:'Population', value: fmtNum(c.population), cls:''},
  ];
  return `
  <h1>Tableau de bord — ${escapeHtml(c.name)}</h1>
  <div class="subtitle">${escapeHtml(c.regime)} · Capitale : ${escapeHtml(cityById(c,c.capitalCityId).name)} · ${turnDateLabel(state.player.turn)} · Mandat n°${c.mandate.term}</div>
  <div class="grid kpis" style="margin-bottom:14px;">
    ${kpis.map(k=>`<div class="card kpi"><div class="label">${k.label}</div><div class="value num ${k.cls}">${k.value}</div></div>`).join('')}
  </div>
  <div class="grid cols2">
    <div class="card">
      <h3>Mandat présidentiel</h3>
      <div class="row"><span class="rl">Progression du mandat en cours</span><span class="rv">${mandatePct}%</span></div>
      <div class="bar"><i style="width:${mandatePct}%"></i></div>
      <div class="btn-row"><button class="btn primary" onclick="advanceTurn()">Avancer d'un mois ▸</button></div>
    </div>
    <div class="card">
      <h3>Journal du gouvernement</h3>
      <div class="log">${renderLog(c)}</div>
    </div>
  </div>`;
}
function renderLog(c){
  if(!c.log.length) return `<div class="empty">Aucun événement pour l'instant.</div>`;
  return c.log.slice(-25).map(l=>`<div class="entry">${escapeHtml(l.msg)}<time>${turnDateLabel(l.turn)}</time></div>`).join('');
}

/* ---- Diplomacy ---- */
function diplomacyRows(){
  const player = state.player.countryId;
  const q = (state.diploFilter||'').toLowerCase();
  const others = COUNTRIES_DATA.filter(c=>c.id!==player && c.name.toLowerCase().includes(q));
  if(!others.length) return '<tr><td colspan="4" class="empty">Aucun pays trouvé.</td></tr>';
  return others.map(o=>{
    const rel = getRelation(player,o.id);
    return `<tr>
      <td>${flagEmoji(o.iso2)} ${escapeHtml(o.name)}</td>
      <td>${statusPill(rel.status)}</td>
      <td class="num">${Math.round(rel.score)}/100</td>
      <td><div class="btn-row" style="margin:0;">
        ${DIPLO_ACTIONS.map(a=>`<button class="btn sm" onclick="diploAction('${o.id}','${a.id}')">${a.label}</button>`).join('')}
      </div></td>
    </tr>`;
  }).join('');
}

  if(!state.editMode){
    return `<h1>Éditeur</h1>
    <div class="card"><p>Le mode Éditeur permet de modifier librement n'importe quel champ de n'importe quel pays du monde (bac à sable) : population, économie, budget, indices sociaux, sécurité, et de créer des ressources, entreprises ou villes.</p>
    <div class="btn-row"><button class="btn primary" onclick="toggleEditMode()">Activer le mode Éditeur</button></div></div>`;
  }
  const targetId = state.editorTargetId || state.player.countryId;
  return `
  <h1>Éditeur — Mode bac à sable</h1>
  <div class="editor-banner">Toute valeur ci-dessous est modifiable et prend effet immédiatement. Cela peut déséquilibrer la partie : à utiliser en connaissance de cause.</div>
  <div class="field" style="max-width:420px;"><label>Pays à modifier</label>
    <select onchange="setEditorTarget(this.value)">
      ${COUNTRIES_DATA.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(cc=>`<option value="${cc.id}" ${targetId===cc.id?'selected':''}>${flagEmoji(cc.iso2)} ${escapeHtml(cc.name)}</option>`).join('')}
    </select>
  </div>
  <div class="grid cols2" style="margin-top:14px;">
    <div class="card"><h3>Identité &amp; régime</h3>
      ${editText(targetId,'name','Nom du pays')}
      ${editSelect(targetId,'regime','Régime', REGIMES)}
    </div>
    <div class="card"><h3>Démographie &amp; richesse</h3>
      ${editNumber(targetId,'population','Population')}
      ${editNumber(targetId,'gdp','PIB (Md $)')}
      ${editNumber(targetId,'budget.treasury','Trésor public ($)')}
    </div>
    <div class="card"><h3>Fiscalité &amp; dépenses</h3>
      ${editNumber(targetId,'budget.taxIncome','Impôt revenu (%)')}
      ${editNumber(targetId,'budget.taxCorporate','Impôt société (%)')}
      ${editNumber(targetId,'budget.spending.sante','Dépense santé (%)')}
      ${editNumber(targetId,'budget.spending.education','Dépense éducation (%)')}
      ${editNumber(targetId,'budget.spending.defense','Dépense défense (%)')}
      ${editNumber(targetId,'budget.spending.police','Dépense police (%)')}
      ${editNumber(targetId,'budget.spending.social','Dépense sociale (%)')}
      ${editNumber(targetId,'budget.spending.infra','Dépense infrastructures (%)')}
    </div>
    <div class="card"><h3>Indicateurs économiques</h3>
      ${editNumber(targetId,'economy.growth','Croissance (%)')}
      ${editNumber(targetId,'economy.unemployment','Chômage (%)')}
      ${editNumber(targetId,'economy.inflation','Inflation (%)')}
      ${editNumber(targetId,'economy.approval','Popularité (%)')}
    </div>
    <div class="card"><h3>Social</h3>
      ${editSelect(targetId,'social.immigration','Politique migratoire', IMMIGRATION_POLICIES.map(p=>p.id))}
      ${editNumber(targetId,'social.healthIndex','Indice santé')}
      ${editNumber(targetId,'social.educationIndex','Indice éducation')}
      ${editNumber(targetId,'social.pensionLevel','Pensions (%)')}
      ${editNumber(targetId,'social.unemploymentBenefit','Allocations chômage (%)')}
    </div>
    <div class="card"><h3>Sécurité</h3>
      ${editNumber(targetId,'police.officers','Effectifs policiers')}
      ${editNumber(targetId,'police.equipment','Équipement policier (%)')}
      ${editNumber(targetId,'police.crimeIndex','Criminalité (%)')}
      ${editNumber(targetId,'military.troops','Effectifs militaires')}
      ${editNumber(targetId,'military.arms','Niveau armement (%)')}
    </div>
  </div>
  <div class="grid cols2" style="margin-top:14px;">
    <div class="card"><h3>Créer une ressource</h3>
      <div class="field"><label>Type</label><select id="newResType">${RESOURCE_POOL.map(r=>`<option value="${r.type}">${r.name}</option>`).join('')}</select></div>
      <div class="field"><label>Quantité</label><input type="number" id="newResAmount" value="5000"></div>
      <div class="btn-row"><button class="btn" onclick="editAddResource('${targetId}', document.getElementById('newResType').value, document.getElementById('newResAmount').value)">Ajouter la ressource</button></div>
    </div>
    <div class="card"><h3>Créer une entreprise</h3>
      <div class="field"><label>Nom</label><input type="text" id="newCoName" value="Nouvelle entreprise"></div>
      <div class="field"><label>Secteur</label><select id="newCoSector">${COMPANY_SECTORS.map(s=>`<option>${s}</option>`).join('')}</select></div>
      <div class="field"><label>Propriété</label><select id="newCoOwn"><option value="public">Publique</option><option value="privée">Privée</option></select></div>
      <div class="field"><label>Valeur ($)</label><input type="number" id="newCoValue" value="10000000"></div>
      <div class="btn-row"><button class="btn" onclick="editAddCompany('${targetId}', document.getElementById('newCoName').value, document.getElementById('newCoSector').value, document.getElementById('newCoOwn').value, document.getElementById('newCoValue').value)">Ajouter l'entreprise</button></div>
    </div>
    <div class="card"><h3>Créer une ville</h3>
      <div class="field"><label>Nom</label><input type="text" id="newCityName" value="Nouvelle ville"></div>
      <div class="field"><label>Population</label><input type="number" id="newCityPop" value="50000"></div>
      <div class="field"><label style="display:flex;align-items:center;gap:6px;text-transform:none;font-size:13px;color:var(--parchment);"><input type="checkbox" id="newCityCoastal" style="width:auto;"> Accès maritime / fluvial (nécessaire pour les ports)</label></div>
      <div class="btn-row"><button class="btn" onclick="editAddCity('${targetId}', document.getElementById('newCityName').value, document.getElementById('newCityPop').value, document.getElementById('newCityCoastal').checked)">Ajouter la ville</button></div>
    </div>
  </div>`;
}

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  if(loadGame()){ render(); }
  else { state = { screen: 'select' }; render(); }
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
}
boot();

</script>
</body>
</html>
